# Uc pod, uc akis.
#
#   frontend --18080--> api              uygulama yolu
#   frontend --18081--> api              admin/metrik yolu
#   api      --19090--> store            veri yolu
#
# Neden uc akis: her ariza senaryosu BIR akisi keser, digerleri ayakta kalir.
# Gozlenen kumede hem kirilan hem korunan taraf bulunur; dogrulama kapisinin
# "neyi acmali, neyi kapatmamali" sorusu ancak boyle olculebilir. Tek akisla
# kumenin tamami kirik olurdu ve kapinin mesru trafigi kapatmasi (UPR)
# gorunmez kalirdi.
#
# Portlar sira disi secildi: dugumdeki diger is yukleriyle karismasin.
#
# nodeName MAKINEYE OZGUDUR. Uc pod da flowmon'un calistigi dugume sabit
# olmali, cunku probe dugum basina calisiyor ve connect() ile kanca ayni
# cekirdekte gerceklesmek zorunda. Buradaki "master" yalnizca varsayilan;
# scripts/env.sh uygularken $NODE degiskeniyle (varsayilan: `hostname`)
# bu satirlari yeniden yaziyor. Manifesti dogrudan kubectl ile uygularsaniz
# kendi dugum adinizla degistirin.
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: agentic-sre
spec:
  selector: { app: api }
  ports:
    - { name: app,   port: 18080, targetPort: 18080 }
    - { name: admin, port: 18081, targetPort: 18081 }
---
apiVersion: v1
kind: Service
metadata:
  name: store
  namespace: agentic-sre
spec:
  selector: { app: store }
  ports:
    - { name: data, port: 19090, targetPort: 19090 }
---
apiVersion: v1
kind: Pod
metadata:
  name: store
  namespace: agentic-sre
  labels: { app: store, tier: data }
spec:
  nodeName: master
  tolerations:
    - { key: node-role.kubernetes.io/control-plane, operator: Exists, effect: NoSchedule }
  containers:
    - name: store
      image: busybox:1.36
      command: ["sh", "-c"]
      args:
        - mkdir -p /data && echo store-ok > /data/index.html && httpd -f -p 19090 -h /data
      ports:
        - { name: data, containerPort: 19090 }
---
apiVersion: v1
kind: Pod
metadata:
  name: api
  namespace: agentic-sre
  labels: { app: api, tier: backend }
spec:
  nodeName: master
  tolerations:
    - { key: node-role.kubernetes.io/control-plane, operator: Exists, effect: NoSchedule }
  containers:
    - name: api
      image: busybox:1.36
      command: ["sh", "-c"]
      # Iki httpd arka planda servis verir; on plandaki dongu store'a baglanir.
      # On plandaki islem PID 1 olarak kalmali, yoksa pod tamamlanmis sayilir.
      args:
        - |
          mkdir -p /www /admin
          echo api-ok       > /www/index.html
          echo api-admin-ok > /admin/index.html
          httpd -f -p 18080 -h /www &
          httpd -f -p 18081 -h /admin &
          while true; do
            wget -T 3 -q -O /dev/null http://store.agentic-sre.svc.cluster.local:19090/ 2>/dev/null
            sleep 3
          done
      ports:
        - { name: app,   containerPort: 18080 }
        - { name: admin, containerPort: 18081 }
---
apiVersion: v1
kind: Pod
metadata:
  name: frontend
  namespace: agentic-sre
  labels: { app: frontend, tier: web }
spec:
  nodeName: master
  tolerations:
    - { key: node-role.kubernetes.io/control-plane, operator: Exists, effect: NoSchedule }
  containers:
    - name: frontend
      image: busybox:1.36
      command: ["sh", "-c"]
      # Iki dongu bagimsiz: kesilen yol 3 sn timeout'a girdiginde saglam
      # yolun olcum sikligini dusurmesin.
      args:
        - |
          SVC=api.agentic-sre.svc.cluster.local
          while true; do wget -T 3 -q -O /dev/null http://$SVC:18080/ 2>/dev/null; sleep 2; done &
          while true; do wget -T 3 -q -O /dev/null http://$SVC:18081/ 2>/dev/null; sleep 4; done
